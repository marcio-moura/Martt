<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1C1A" media="(prefers-color-scheme: dark)" />
    <title>Ecossistema Martt</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" />
    <script>
      try { var t = localStorage.getItem('martt-tema'); if (t === 'claro') document.documentElement.dataset.theme = 'light'; if (t === 'escuro') document.documentElement.dataset.theme = 'dark' } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
