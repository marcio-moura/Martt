<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}#selo{width:900px;height:960px;display:block}</style></head><body>
<svg id="selo" viewBox="0 0 900 960" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <!-- escudo: topo reto, laterais que afunilam até a ponta -->
  <path id="esc" d="M450 40 L820 120 L820 470 C820 650 650 790 450 880 C250 790 80 650 80 470 L80 120 Z"/>
  <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#FFF3A0"/><stop offset=".25" stop-color="#F5C400"/>
   <stop offset=".55" stop-color="#C99A00"/><stop offset=".8" stop-color="#F5C400"/><stop offset="1" stop-color="#8A6A00"/></linearGradient>
  <linearGradient id="lado" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A5C00"/><stop offset="1" stop-color="#3D2E00"/></linearGradient>
  <linearGradient id="preto" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#3A3B3E"/><stop offset=".35" stop-color="#151617"/><stop offset="1" stop-color="#050505"/></linearGradient>
  <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="faixa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE45C"/><stop offset=".5" stop-color="#F5C400"/><stop offset="1" stop-color="#B88C00"/></linearGradient>
  <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#000" flood-opacity=".85"/></filter>
  <filter id="sombraTxt"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000" flood-opacity=".6"/></filter>
  <clipPath id="dentro"><use href="#esc" transform="translate(450 470) scale(.86) translate(-450 -470)"/></clipPath>
 </defs>
 <g filter="url(#sombra)">
  <!-- extrusão (profundidade 3D) -->
  <use href="#esc" fill="url(#lado)" transform="translate(0 26)"/>
  <use href="#esc" fill="url(#lado)" transform="translate(0 13)"/>
  <!-- borda dourada chanfrada -->
  <use href="#esc" fill="url(#ouro)"/>
  <use href="#esc" fill="none" stroke="#FFF7C2" stroke-opacity=".7" stroke-width="4"/>
  <!-- miolo preto -->
  <use href="#esc" fill="#000" transform="translate(450 470) scale(.88) translate(-450 -470)"/>
  <use href="#esc" fill="url(#preto)" transform="translate(450 470) scale(.86) translate(-450 -470)"/>
 </g>
 <!-- reflexo na metade de cima -->
 <g clip-path="url(#dentro)"><path d="M0 0 H900 V380 C700 330 250 470 0 420 Z" fill="url(#brilho)"/></g>
 <!-- logo original -->
 <image href="../../marca/logo-fundo-escuro.png" x="185" y="215" width="530" height="254" preserveAspectRatio="xMidYMid meet"/>
 <!-- faixa BLACK -->
 <g filter="url(#sombraTxt)">
  <path d="M70 530 H830 L800 580 L830 630 H70 L100 580 Z" fill="#6E5300" transform="translate(0 12)"/>
  <path d="M70 530 H830 L800 580 L830 630 H70 L100 580 Z" fill="url(#faixa)"/>
 </g>
 <text x="450" y="608" text-anchor="middle" font-family="Anton" font-size="96" letter-spacing="18" fill="#0A0A0A">BLACK</text>
 <!-- estrela de brilho -->
 <g transform="translate(735 175)"><path d="M0 -34 L7 -7 L34 0 L7 7 L0 34 L-7 7 L-34 0 L-7 -7 Z" fill="#FFF8D0"/></g>
<g fill="#F5C400"><circle cx="390" cy="700" r="9"/><circle cx="450" cy="712" r="11"/><circle cx="510" cy="700" r="9"/></g></svg></body></html>
