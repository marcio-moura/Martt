<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intraface Radiologia — 20 anos</title>
<style>
@font-face { font-family: "Cormorant"; src: url("fontes/Cormorant.ttf"); font-weight: 300 700; }
@font-face { font-family: "Cormorant"; src: url("fontes/Cormorant-Italic.ttf"); font-weight: 300 700; font-style: italic; }
@font-face { font-family: "Montserrat"; src: url("fontes/Montserrat.ttf"); font-weight: 100 900; }

:root {
  --creme: #f6efe3;
  --ouro: #d9b77e;
  --noite: #0b0907;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; color: var(--creme); overflow: hidden; }
body { font-family: "Cormorant", Georgia, serif; }

#palco-wrap { position: fixed; inset: 0; display: grid; place-items: center; }
#palco {
  position: absolute; width: 1920px; height: 1080px; overflow: hidden;
  background: var(--noite); transform-origin: 50% 50%;
}
.foto {
  position: absolute; inset: -4%; background-size: cover; background-position: center;
  will-change: transform, opacity;
}
.vazio {
  background:
    radial-gradient(ellipse 60% 55% at 50% 42%, rgba(217,183,126,.20), transparent 70%),
    radial-gradient(ellipse 90% 80% at 30% 80%, rgba(120,80,50,.25), transparent 70%),
    linear-gradient(160deg, #4a3a2c, #241b14 60%, #140f0b);
}
.vazio .etq {
  position: absolute; left: 50%; top: 12%; transform: translateX(-50%);
  font: 500 20px/1 "Montserrat", sans-serif; letter-spacing: .3em; text-transform: uppercase;
  color: rgba(246,239,227,.38); border: 1px dashed rgba(246,239,227,.25); padding: 14px 22px;
}
#c3d { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0; }
#escurece { position: absolute; inset: 0; background: #000; pointer-events: none; }
#base {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(to bottom, transparent 38%, rgba(8,6,4,.55) 62%, rgba(8,6,4,.92) 100%);
}
.bloco.baixo { top: auto; bottom: 120px; }
.baixo.frase { font-size: 58px; }
.baixo .ln { font-size: 54px; line-height: 1.3; }
.baixo .tl { margin-bottom: 26px; }
#vinheta {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 45%, rgba(0,0,0,.75) 100%);
}
#grao {
  position: absolute; inset: -50%; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
#texto { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 180px; }
.bloco { position: absolute; left: 180px; right: 180px; top: 50%; transform: translateY(-50%); }

.frase { font-weight: 400; font-size: 68px; line-height: 1.22; text-shadow: 0 2px 30px rgba(0,0,0,.6); }
.frase em, .lista em, .final em { font-style: italic; color: var(--ouro); }

.capitulo .num { font: 500 22px/1 "Montserrat", sans-serif; letter-spacing: .5em; color: var(--ouro); margin-bottom: 34px; }
.capitulo .tit { font-style: italic; font-weight: 400; font-size: 104px; line-height: 1.05; }
.capitulo .linha, .titulo .linha { width: 0; height: 1px; background: var(--ouro); margin: 40px auto 0; }

.ano { font-weight: 300; font-size: 300px; line-height: 1; letter-spacing: .04em; color: var(--creme); }
.ano span { display: inline-block; }

.titulo .nome { white-space: nowrap; font: 300 76px/1 "Montserrat", sans-serif; letter-spacing: .34em; padding-left: .34em; }
.titulo .sub { font-style: italic; font-size: 50px; margin-top: 40px; color: var(--creme); opacity: .9; }
.titulo img { max-width: 760px; max-height: 300px; margin-bottom: 30px; }

.lista .tl { font: 500 22px/1 "Montserrat", sans-serif; letter-spacing: .5em; color: var(--ouro); margin-bottom: 40px; text-transform: uppercase; }
.lista .ln { font-size: 66px; line-height: 1.32; }
.final .ln { font-size: 64px; line-height: 1.35; }
.final .ln + .ln { margin-top: 10px; }

#ui {
  position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 18px 18px;
  background: linear-gradient(transparent, rgba(0,0,0,.85)); display: flex; gap: 14px; align-items: center;
  font: 500 13px/1 "Montserrat", sans-serif; color: #ddd; transition: opacity .4s; z-index: 5;
}
body.parado #ui, #ui:hover { opacity: 1; }
body:not(.parado) #ui { opacity: 0; }
#ui button {
  background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 999px; min-width: 44px; height: 44px;
  font: inherit; cursor: pointer; padding: 0 16px;
}
#barra { flex: 1; accent-color: var(--ouro); height: 44px; }
#tempo { min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
#capa {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; cursor: pointer;
  background: rgba(0,0,0,.55); font: 500 15px/1.5 "Montserrat", sans-serif; letter-spacing: .25em; text-transform: uppercase;
}
#capa div { border: 1px solid rgba(246,239,227,.5); padding: 22px 34px; border-radius: 999px; }
body.render #ui, body.render #capa { display: none; }
@media (max-width: 600px) { #ui { gap: 8px; padding: 10px 12px 14px; } #tempo { min-width: 0; } }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>

<body class="parado">
<div id="palco-wrap"><div id="palco">
  <div id="fotos"></div>
  <canvas id="c3d" width="1920" height="1080"></canvas>
  <div id="escurece"></div>
  <div id="base"></div>
  <div id="vinheta"></div>
  <div id="grao"></div>
  <div id="texto"></div>
</div></div>

<div id="capa"><div>▶ Assistir</div></div>
<div id="ui">
  <button id="play" aria-label="Tocar ou pausar">▶</button>
  <input id="barra" type="range" min="0" step="0.01" value="0" aria-label="Posição">
  <span id="tempo">0:00</span>
  <button id="tela" aria-label="Tela cheia">⛶</button>
</div>
<audio id="som" preload="auto"></audio>

<script src="roteiro.js"></script>
<script type="module">
  import { iniciar } from "./cena3d.js";
  window.__c3dPronto = (async () => {
    await document.fonts.load("700 92px Montserrat");
    window.__c3d = await iniciar(document.getElementById("c3d"));
  })();
</script>
<script>
(() => {
  const FADE_TXT = 0.9, CROSS = 1.6, KB = 0.08;

  // ---------- monta a linha do tempo ----------
  const durTexto = (x) => {
    if (x.dur) return x.dur;
    const plain = (x.t || (x.linhas || []).join(" ")).replace(/<[^>]+>/g, " ");
    const palavras = plain.split(/\s+/).filter(Boolean).length;
    return Math.max(4.2, 2.2 + palavras * 0.36);
  };
  const itens = [];
  let t = 0, fotoAt = null, tomAt = "cor";
  ROTEIRO.forEach((x, i) => {
    if ("foto" in x) { fotoAt = x.foto; tomAt = x.tom || "cor"; }
    const d = durTexto(x);
    itens.push({ ...x, i, ini: t, fim: t + d, fotoAtual: fotoAt, tomAtual: tomAt });
    t += d;
  });
  const corridas = [];
  itens.forEach((it) => {
    const u = corridas[corridas.length - 1];
    if (u && u.foto === it.fotoAtual && u.tom === it.tomAtual) u.fim = it.fim;
    else corridas.push({ foto: it.fotoAtual, tom: it.tomAtual, ini: it.ini, fim: it.fim, i: corridas.length });
  });
  const TOTAL = t;
  window.__TOTAL = TOTAL;
  window.__ARQUIVOS = [...new Set(corridas.map((c) => c.foto).filter((f) => f && !f.startsWith("3d:")))];

  // ---------- elementos ----------
  const $ = (s) => document.querySelector(s);
  const palco = $("#palco"), camFotos = $("#fotos"), camTexto = $("#texto"), escurece = $("#escurece"), base = $("#base");
  const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  const camadas = new Map();
  function camada(c) {
    if (camadas.has(c.i)) return camadas.get(c.i);
    const d = document.createElement("div");
    d.className = "foto";
    d.style.backgroundImage = `url("fotos/${c.foto}")`;
    d.style.opacity = 0;
    camFotos.appendChild(d);
    camadas.set(c.i, d);
    return d;
  }

  function desenhaFotos(t) {
    const vis = new Set();
    let op3d = 0;
    corridas.forEach((c) => {
      if (!c.foto) return;
      if (c.foto.startsWith("3d:")) {
        const a = c.ini - CROSS / 2, b = c.fim + CROSS / 2;
        if (t < a || t > b) return;
        op3d = Math.min(ease((t - a) / CROSS), ease((b - t) / CROSS));
        if (window.__c3d) window.__c3d.desenha(c.foto.slice(3), t - c.ini, c.fim - c.ini);
        return;
      }
      const a = c.ini - CROSS / 2, b = c.fim + CROSS / 2;
      if (t < a || t > b) return;
      const el = camada(c);
      const prog = clamp((t - a) / (b - a), 0, 1);
      const dir = c.i % 4;
      const s = 1 + (dir % 2 ? KB * (1 - prog) : KB * prog);
      const dx = (dir < 2 ? -1 : 1) * 1.6 * (prog - 0.5);
      const dy = (dir % 3 ? 1 : -1) * 1.0 * (prog - 0.5);
      el.style.opacity = Math.min(ease((t - a) / CROSS), ease((b - t) / CROSS));
      el.style.transform = `translate(${dx}%, ${dy}%) scale(${s})`;
      el.style.filter = c.tom === "antigo"
        ? "sepia(.5) saturate(.8) contrast(1.05) brightness(.95)"
        : "saturate(1.03) contrast(1.03)";
      vis.add(el);
    });
    camadas.forEach((el) => { if (!vis.has(el)) el.style.opacity = 0; });
    $("#c3d").style.opacity = op3d;
  }

  // ---------- textos ----------
  const blocos = new Map();
  function html(it) {
    switch (it.tipo) {
      case "capitulo": return `<div class="bloco capitulo"><div class="num">CAPÍTULO ${it.n}</div><div class="tit">${it.t}</div><div class="linha"></div></div>`;
      case "ano": return `<div class="bloco ano">${[...it.t].map((c) => `<span>${c}</span>`).join("")}</div>`;
      case "titulo": {
        const logo = it.logo && window.LOGO ? `<img src="fotos/${LOGO}" alt="">` : "";
        const nome = logo ? "" : `<div class="nome">${it.t}</div>`;
        return `<div class="bloco titulo">${logo}${nome}<div class="linha"></div><div class="sub">${it.sub || ""}</div></div>`;
      }
      case "lista": case "final":
        return `<div class="bloco ${it.tipo}">${it.titulo ? `<div class="tl">${it.titulo}</div>` : ""}${it.linhas.map((l) => `<div class="ln">${l}</div>`).join("")}</div>`;
      case "pausa": case "respiro": return `<div class="bloco"></div>`;
      default: return `<div class="bloco frase">${it.t}</div>`;
    }
  }
  function bloco(it, key) {
    if (blocos.has(key)) return blocos.get(key);
    const w = document.createElement("div");
    w.innerHTML = html(it);
    const el = w.firstChild;
    if (it.fotoAtual && !["capitulo", "ano", "titulo"].includes(it.tipo)) el.classList.add("baixo");
    el.style.opacity = 0;
    camTexto.appendChild(el);
    blocos.set(key, el);
    return el;
  }

  function anima(el, it, t) {
    const d = it.fim - it.ini, lt = t - it.ini;
    const entra = ease(lt / FADE_TXT), sai = ease((it.fim - t) / FADE_TXT);
    const op = Math.min(entra, sai);
    el.style.opacity = op;
    const subir = (1 - entra) * 18;
    const y0 = el.classList.contains("baixo") ? "0px" : "-50%";
    el.style.transform = `translateY(calc(${y0} + ${subir}px))`;
    el.style.filter = `blur(${(1 - entra) * 8}px)`;

    if (it.tipo === "capitulo" || it.tipo === "titulo") {
      const ln = el.querySelector(".linha");
      ln.style.width = 260 * ease((lt - 0.4) / 1.6) + "px";
    }
    if (it.tipo === "titulo") {
      const nome = el.querySelector(".nome");
      if (nome) nome.style.letterSpacing = (0.42 - 0.12 * ease(lt / 5)) + "em";
      const sub = el.querySelector(".sub");
      sub.style.opacity = ease((lt - 1.4) / 1.2);
    }
    if (it.tipo === "ano") {
      el.querySelectorAll("span").forEach((s, k) => {
        const e = ease((lt - k * 0.18) / 1.1);
        s.style.opacity = e;
        s.style.transform = `translateY(${(1 - e) * 40}px)`;
      });
      el.style.transform = `translateY(-50%) scale(${1 + 0.04 * (lt / d)})`;
    }
    if (it.tipo === "lista" || it.tipo === "final") {
      const lns = el.querySelectorAll(".ln");
      const inicio = it.titulo ? 0.9 : 0.2;
      const passo = Math.min(1.5, (d - inicio - 2.6) / lns.length);
      lns.forEach((l, k) => {
        const e = ease((lt - inicio - k * passo) / 0.9);
        l.style.opacity = e;
        l.style.transform = `translateY(${(1 - e) * 14}px)`;
        l.style.filter = `blur(${(1 - e) * 6}px)`;
      });
    }
  }

  function desenhaTexto(t) {
    let cob = 0, cobBaixo = 0;
    const vis = new Set();
    itens.forEach((it) => {
      if (t < it.ini || t > it.fim) return;
      const el = bloco(it, it.i);
      anima(el, it, t);
      vis.add(el);
      if (it.tipo === "respiro" || it.tipo === "pausa") return;
      const c = Math.min(ease((t - it.ini) / 1.2), ease((it.fim - t) / 1.2));
      if (el.classList.contains("baixo")) cobBaixo = Math.max(cobBaixo, c); else cob = Math.max(cob, c);
    });
    blocos.forEach((el) => { if (!vis.has(el)) el.style.opacity = 0; });
    return [cob, cobBaixo];
  }

  function desenha(t) {
    desenhaFotos(t);
    const [cob, cobBaixo] = desenhaTexto(t);
    const ab = ease(t / 2), fe = ease((TOTAL - t) / 2.5), vivo = Math.min(ab, fe);
    escurece.style.opacity = clamp(1 - vivo + vivo * (0.06 + 0.4 * cob + 0.14 * cobBaixo), 0, 1);
    base.style.opacity = cobBaixo;
    $("#grao").style.transform = `translate(${(Math.sin(t * 37) * 3).toFixed(2)}%, ${(Math.cos(t * 23) * 3).toFixed(2)}%)`;
  }

  // ---------- encaixe na janela ----------
  function encaixa() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    palco.style.transform = `scale(${s})`;
  }
  addEventListener("resize", encaixa); encaixa();

  // ---------- modo render (usado para gerar o MP4) ----------
  window.__seek = (x) => desenha(x);
  if (new URLSearchParams(location.search).has("render")) {
    document.body.classList.add("render");
    desenha(0);
    window.__pronto = document.fonts.ready.then(() => new Promise((r) => { const k = () => window.__c3dPronto ? r(window.__c3dPronto) : setTimeout(k, 50); k(); })).then(() => Promise.all(
      window.__ARQUIVOS.concat(LOGO ? [LOGO] : []).map((f) => new Promise((r) => {
        const im = new Image(); im.onload = im.onerror = r; im.src = "fotos/" + f;
      }))
    ));
    return;
  }

  // ---------- player ----------
  const som = $("#som"), barra = $("#barra"), btn = $("#play"), tempo = $("#tempo");
  if (window.TRILHA) som.src = "trilha/" + TRILHA;
  barra.max = TOTAL;
  let pos = 0, tocando = false, ultimo = 0;
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  function quadro(ts) {
    if (!tocando) return;
    if (som.src && !som.paused) pos = som.currentTime; else pos += (ts - ultimo) / 1000;
    ultimo = ts;
    if (pos >= TOTAL) { pos = TOTAL; pausa(); }
    desenha(pos); barra.value = pos; tempo.textContent = fmt(pos);
    requestAnimationFrame(quadro);
  }
  function toca() {
    if (pos >= TOTAL) pos = 0;
    tocando = true; btn.textContent = "❚❚"; document.body.classList.remove("parado"); $("#capa").style.display = "none";
    if (som.src) { som.currentTime = pos; som.play().catch(() => {}); }
    ultimo = performance.now(); requestAnimationFrame(quadro);
  }
  function pausa() { tocando = false; btn.textContent = "▶"; document.body.classList.add("parado"); som.pause(); }
  btn.onclick = () => tocando ? pausa() : toca();
  $("#capa").onclick = toca;
  barra.oninput = () => { pos = +barra.value; desenha(pos); tempo.textContent = fmt(pos); if (som.src) som.currentTime = pos; };
  $("#tela").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); btn.click(); }
    if (e.key === "f") $("#tela").click();
  });
  let tmr; addEventListener("mousemove", () => {
    document.body.classList.add("parado"); clearTimeout(tmr);
    tmr = setTimeout(() => tocando && document.body.classList.remove("parado"), 1800);
  });
  document.fonts.ready.then(() => desenha(0));
  desenha(0); tempo.textContent = `0:00 / ${fmt(TOTAL)}`;
})();
</script>
